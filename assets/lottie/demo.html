<!doctype html>
<meta charset="utf-8"><title>Multigate Lottie preview</title>
<style>body{margin:0;display:flex;gap:24px;padding:24px;font:14px system-ui;background:#fcfcfc}div{width:300px}.a{width:300px;height:300px}</style>
<div><div class="a" id="collect"></div>Collect</div>
<div><div class="a" id="convert"></div>Convert</div>
<div><div class="a" id="pay"></div>Pay</div>
<div style="width:420px"><div class="a" id="globe" style="width:420px;height:420px"></div>Hero globe</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
["collect","convert","pay","globe"].forEach(n => lottie.loadAnimation({ container: document.getElementById(n), renderer: "svg", loop: true, autoplay: true, path: "multigate-" + n + ".json" }));
</script>
